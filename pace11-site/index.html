<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pace11</title>
<style>
:root{--bg:#F4F5F7;--card:#fff;--text:#16181D;--sub:#5A606B;--line:#E3E6EC;--accent:#5546E0}
@media (prefers-color-scheme:dark){:root{--bg:#0F1115;--card:#1A1D23;--text:#F2F3F5;--sub:#A7ADB8;--line:#2A2E36;--accent:#8B80FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
main{max-width:760px;margin:0 auto;padding:40px 16px}
h1{font-size:24px;margin:0 0 20px}
a.app{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;color:var(--text);text-decoration:none}
a.app strong{display:block;font-size:17px}
a.app span{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;text-align:center;padding:24px 16px 40px}
</style>
</head>
<body>
<main>
<h1>pace11 のアプリ</h1>
<a class="app" href="kintore-mentor/"><strong>筋トレメンター</strong><span>筋肉の成長が見える、続けたくなる筋トレ記録</span></a>
</main>
<footer>© 杉原俊祐</footer>
</body>
</html>
